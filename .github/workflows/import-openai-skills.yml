name: Import skills to OpenAI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list skills without uploading"
        required: true
        default: true
        type: boolean

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import skills
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PROJECT: ${{ secrets.OPENAI_PROJECT }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/import-openai-skills.mjs --dry-run
          else
            node scripts/import-openai-skills.mjs
          fi
